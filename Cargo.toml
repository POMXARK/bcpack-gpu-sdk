[package]
name = "bcpack-gpu-sdk"
version = "0.11.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Clean-room Xbox Series BCPack (MDU rANS) GPU Compute SDK: Zero-Copy DX12 C-ABI DLL, AMD Gfx10 Detiler, SM 6.6 Descriptor Pager, Compute RayQuery RTGI, VRS Tier 2 & Vulkan 1.3 SPIR-V Kernels"
repository = "https://github.com/POMXARK/bcpack-gpu-sdk"
homepage = "https://github.com/POMXARK/bcpack-gpu-sdk"
readme = "README.md"
keywords = ["bcpack", "directx12", "vulkan", "hlsl", "spirv"]
categories = ["graphics", "compression", "rendering", "hardware-support", "api-bindings"]

[lib]
name = "bcpack_gpu"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "b1c3099a3402de8b76c9263a828791bd8bc0c930", default-features = false }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
